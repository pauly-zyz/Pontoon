<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1500px;height:500px;overflow:hidden;background:#070c16}
.root{position:relative;width:1500px;height:500px;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#e7edf7;
 background:radial-gradient(700px 380px at 72% -10%, rgba(45,212,191,.22), transparent 70%),
 radial-gradient(600px 360px at 105% 90%, rgba(167,139,250,.20), transparent 70%),
 radial-gradient(520px 300px at 18% 120%, rgba(45,212,191,.10), transparent 70%), #070c16;}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:50px 50px;
 -webkit-mask-image:radial-gradient(ellipse 70% 90% at 60% 40%, #000 30%, transparent 85%);}
.waves{position:absolute;left:0;right:0;bottom:0;height:120px}
.content{position:absolute;left:470px;top:78px;width:620px}
.brand{display:flex;align-items:center;gap:18px}
.mark{width:76px;height:76px;border-radius:22px;background:radial-gradient(circle at 30% 22%,#7cf5e2,#2dd4bf 45%,#0f9e8c);
 box-shadow:0 0 50px rgba(45,212,191,.45), inset 0 1px 0 rgba(255,255,255,.35);display:grid;place-items:center}
.mark svg{width:54px;height:54px}
.name{font-family:"Space Grotesk";font-weight:700;font-size:44px;letter-spacing:-.5px}
h1{margin:26px 0 0;font-family:"Space Grotesk";font-weight:700;font-size:78px;line-height:.98;letter-spacing:-2px}
.grad{background:linear-gradient(100deg,#5eead4,#2dd4bf 35%,#a78bfa 75%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:22px;font-size:21px;color:#9fb0c9}
.chips{position:absolute;right:70px;top:110px;display:flex;flex-direction:column;gap:16px;width:300px}
.chip{display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:16px;background:rgba(13,21,36,.78);
 border:1.5px solid var(--c);box-shadow:0 10px 30px -12px var(--c);font-family:"Space Grotesk";font-weight:600;font-size:21px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
.chip small{display:block;font-family:Inter;font-weight:400;font-size:14px;color:#8797b1;margin-top:2px}
.handle{position:absolute;right:70px;bottom:44px;font-size:17px;color:#8797b1;display:flex;align-items:center;gap:9px}
.handle svg{width:17px;height:17px;fill:#e7edf7}
.pill{display:inline-flex;align-items:center;gap:9px;margin-top:24px;padding:8px 16px;border-radius:999px;border:1px solid rgba(45,212,191,.35);
 background:rgba(45,212,191,.1);color:#5eead4;font-size:16px;font-weight:500}
.pill i{width:8px;height:8px;border-radius:50%;background:#2dd4bf;box-shadow:0 0 10px #2dd4bf}
</style></head><body><div class="root"><div class="grid"></div>
<svg class="waves" viewBox="0 0 1500 120" preserveAspectRatio="none">
 <path d="M0 70 Q 94 40 188 70 T 375 70 T 563 70 T 750 70 T 938 70 T 1125 70 T 1313 70 T 1500 70 V120 H0Z" fill="rgba(167,139,250,.07)"/>
 <path d="M0 88 Q 125 62 250 88 T 500 88 T 750 88 T 1000 88 T 1250 88 T 1500 88 V120 H0Z" fill="rgba(45,212,191,.10)"/>
</svg>
<div class="content">
 <div class="brand"><div class="mark"><svg viewBox="0 0 100 100">
  <defs>
    <mask id="cut">
      <rect width="100" height="100" fill="#fff"/>
      <rect x="33" y="34" width="14" height="11" rx="3" fill="#000"/>
      <rect x="60.5" y="45" width="9" height="7" rx="2.5" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#cut)" fill="#04211d">
    <rect x="27" y="27" width="26" height="33" rx="6"/>
    <rect x="56" y="39" width="18" height="21" rx="5"/>
  </g>
  <path d="M10 59 H90 Q92 59 91 61 L81 76 Q80 78 77 78 H23 Q20 78 19 76 L9 61 Q8 59 10 59 Z" fill="#04211d"/>
  <path d="M12 88 Q21 82.5 30 88 T48 88 T66 88 T84 88" fill="none" stroke="#04211d" stroke-width="4.5" stroke-linecap="round" opacity="0.5"/>
</svg></div><div class="name">Pontoon</div></div>
 <h1>Every trade<br><span class="grad">gives back.</span></h1>
 <div class="pill"><i></i>Launchpad on Robinhood Chain · built on Pons V2</div>
</div>
<div class="chips">
 <div class="chip" style="--c:#f59e0b"><span class="dot"></span><span>Buyback &amp; burn<small>every trade buys the token back</small></span></div>
 <div class="chip" style="--c:#2dd4bf"><span class="dot"></span><span>ETH rewards<small>paid to stakers on-chain</small></span></div>
 <div class="chip" style="--c:#a78bfa"><span class="dot"></span><span>Creator payouts<small>with a 24h timelock on changes</small></span></div>
</div>
<div class="handle"><svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>@PontoonFamily</div>
</div></body></html>
